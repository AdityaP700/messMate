<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - IIIT Bhubaneswar Mess Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo" data-icon="brand"></div>
        <h1 class="auth-title">IIIT Bhubaneswar Mess</h1>
        <p class="auth-subtitle">Sign in to manage dining coupons, menu, and leave</p>
        <p class="handwritten" style="font-size: 20px; color: var(--primary); margin-top: 6px;">Fresh meals, zero paper queues.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="identifier">Roll Number or Email</label>
          <input
            type="text"
            id="identifier"
            class="form-input"
            placeholder="e.g. B121001 or dean@iiitbbsr.ac.in"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 10px 16px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
        New student? <a href="/register.html" style="font-weight: 600;">Create an account</a>
      </div>

      <div style="margin-top: 22px; padding: 10px 12px; background: var(--glass-subtle); border: 1px solid var(--border-color); border-radius: 8px; font-size: 12px; color: var(--text-muted); text-align: center;">
        Default Superadmin: <code>dean@iiitbbsr.ac.in</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      try {
        const data = await api('/api/auth/me');
        if (data.user) {
          if (data.user.role === 'student') window.location.href = '/student/dashboard.html';
          else if (data.user.role === 'admin') window.location.href = '/admin/dashboard.html';
          else if (data.user.role === 'superadmin') window.location.href = '/superadmin/dashboard.html';
        }
      } catch (e) {}
    })();

    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      if (!identifier || !password) {
        showToast('Please enter both roll number/email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: { identifier, password }
        });

        showToast('Login successful. Redirecting...', 'success');
        setTimeout(() => {
          if (data.user.role === 'student') {
            window.location.href = '/student/dashboard.html';
          } else if (data.user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (data.user.role === 'superadmin') {
            window.location.href = '/superadmin/dashboard.html';
          }
        }, 400);
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
